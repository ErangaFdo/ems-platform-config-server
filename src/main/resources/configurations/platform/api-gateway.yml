spring:
  cloud:
    gateway:
      routes:
        - id: user-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/user/**

        - id: book-route
          uri: lb://BOOK-SERVICE
          predicates:
            - Path=/api/v1/book/**

        - id: borrowing-route
          uri: lb://BORROWING-SERVICE
          predicates:
            - Path=/api/v1/borrowing/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

server:
  port: 7000