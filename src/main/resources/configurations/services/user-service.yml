spring:
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/lms
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:psql}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

servlet:
  multipart:
    enabled: true
    max-file-size: 5MB
    max-request-size: 10MB

server:
  port: 8000
  forward-headers-strategy: framework

app:
  storage:
    path: ${user.home}/.ijse/lms/users

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:9001/eureka}
  instance:
    prefer-ip-address: true